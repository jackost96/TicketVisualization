services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketsystem
      POSTGRES_PASSWORD: ticketsystem
      POSTGRES_DB: ticketsystem
    ports:
      # Host-side 5433 to avoid clashing with a native Postgres already on 5432. Containers
      # talk to each other over the internal Docker network as "db:5432" regardless.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketsystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ticketsystem:ticketsystem@db:5432/ticketsystem
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
